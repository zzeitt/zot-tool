name: auto-release
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from SKILL.md
        id: version
        run: |
          VER=$(grep -m1 '^version:' SKILL.md | sed -E 's/^version:[[:space:]]*//')
          echo "SKILL.md version: ${VER}"
          if [ -z "${VER}" ]; then
            echo "::notice::SKILL.md has no version field — skipping tag"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v${VER}" >/dev/null 2>&1; then
            echo "::notice::Tag v${VER} already exists — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
