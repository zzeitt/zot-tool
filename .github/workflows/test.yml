name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 集成测试全部打同一个 Zotero 测试组库，彼此共享 Test-Misc / Test-Forbidden。
# 两个 run 同时跑时，一个 run 的 teardown 会删掉另一个正在用的 collection，
# 导致对方批量 409 "Collection XXX not found"。这里按仓库级串行化，不按 ref
# —— main push 与 tag push 也会互相踩。
concurrency:
  group: zot-tool-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 2, not the default 1. On a pull_request event the checkout
      # is the synthetic merge commit and tests/conftest.py's run_identity()
      # reads HEAD^2 for the real PR tip — at depth 1 the parents are absent, so
      # that rev-parse fails and the trace note silently records the merge
      # commit instead of the revision actually under test.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # v6 is the first release on the Node.js 24 action runtime; v5 runs on
      # Node.js 20, which GitHub deprecated and removes from runners in
      # September 2026.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyzotero pytest pillow requests

      - name: Unit tests (no API needed)
        run: python -m pytest tests/test_unit.py tests/test_image_compress.py tests/test_zot_guard.py tests/test_review_fixes.py -v

      - name: Integration tests
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_TEST_LIBRARY_ID: ${{ secrets.ZOTERO_TEST_LIBRARY_ID }}
          ZOTERO_TEST_LIBRARY_TYPE: ${{ vars.ZOTERO_TEST_LIBRARY_TYPE || 'group' }}
        run: |
          if [ -z "$ZOTERO_API_KEY" ] || [ -z "$ZOTERO_TEST_LIBRARY_ID" ]; then
            echo "::notice::Secrets not fully configured — skipping integration tests"
            echo "Required: ZOTERO_API_KEY + ZOTERO_TEST_LIBRARY_ID"
            echo "Configure at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi
          python -m pytest tests/ --ignore=tests/test_unit.py --ignore=tests/test_image_compress.py -v
