[pytest]
# sys capture (not the default fd capture): fd-level capture redirects the real
# stdout/stderr file descriptors and, on Windows, intermittently breaks
# subprocess pipe handle duplication ("The handle is invalid" / "The request is
# not supported" from subprocess._make_inheritable). Tests that spawn curl (the
# image-compression suite) hit this flakily. sys capture still captures test
# output — it just doesn't touch the process file descriptors.
addopts = --capture=sys
